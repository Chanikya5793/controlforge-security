api_host: soc.chanakyachowdary.in
api_port: 443
device_id: nw55074-controlforge
controls_path: /Library/Application Support/ControlForge/agents.yml
spool_path: /Library/Application Support/ControlForge/controlforge-agent-spool.db
status_snapshot_path: /Library/ControlForge/status/agent-status.json
credential_source: macos_system_keychain
keychain_service: com.controlforge.collector.v2
access_proxy_required: true
action_polling_enabled: true
credential_rotation_enabled: false
control_snapshot_interval_seconds: 3600
delivery_flush_batch_limit: 25
retry_backoff_initial_seconds: 60
retry_backoff_max_seconds: 3600
retry_backoff_jitter_ratio: 0.2
response_adapter_enabled: false
response_state_path: /Library/Application Support/ControlForge/response/pf-state.json
santa:
  enabled: true
  log_path: /var/db/santa/santa.log
  max_events_per_run: 500
  max_line_bytes: 131072
  max_read_bytes: 2000000
