name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: controlforge-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    name: Production release gates
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish-python:
    name: Publish Python prerelease
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Require an exact version tag
        env:
          CONTROLFORGE_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PYTHONPATH=src python - <<'PY'
          import os
          from controlforge import __version__

          expected = f"v{__version__}"
          actual = os.environ["CONTROLFORGE_RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"release tag {actual!r} must equal {expected!r}")
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: controlforge-python-distributions
          path: dist
      - name: Verify release artifacts and create checksums
        run: |
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS.txt)
          python -m venv "$RUNNER_TEMP/release-wheel"
          "$RUNNER_TEMP/release-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/release-wheel/bin/python" -m pip check
      - name: Create bounded Python prerelease
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ControlForge ${{ github.ref_name }} - Python distributions
          prerelease: true
          make_latest: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            This automated prerelease contains the ControlForge Python wheel and source distribution only.

            The release gates type-check the macOS package sources, but this workflow does not create,
            Developer ID sign, notarize, staple, install, or physically validate a macOS package. It also
            performs no cloud deployment. Do not treat this prerelease as a macOS installer or a
            general-availability production release.
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
