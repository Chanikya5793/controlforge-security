[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "controlforge-security"
version = "0.3.0"
description = "Endpoint security-control assurance and detection automation platform"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Chanakya Thotakura" }]
keywords = [
  "security",
  "detection-engineering",
  "sigma",
  "edr",
  "exposure-monitoring",
  "edge-security",
  "automation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0.2,<7",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "bandit[toml]>=1.7.9,<2",
  "build>=1.2,<2",
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0.12,<7",
]
macos-dist = [
  "pyinstaller>=6.10,<7",
]

[project.scripts]
controlforge = "controlforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/controlforge"]

[tool.hatch.build.targets.wheel.force-include]
"rules" = "controlforge/data/rules"
"config" = "controlforge/data/config"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=controlforge --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "UP045"]

[tool.mypy]
python_version = "3.9"
strict = true
packages = ["controlforge"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
