id: CF-ENDPOINT-003
title: Suspected LSASS credential dumping
description: Detects common process and command-line patterns used to dump LSASS memory.
status: experimental
logsource:
  category: process_creation
  product: windows
detection:
  selection_process:
    process_name|endswith:
      - procdump.exe
      - procdump64.exe
      - rundll32.exe
  selection_target:
    command_line|contains: lsass
  selection_dump:
    command_line|contains:
      - minidump
      - " -ma "
  condition: selection_process and selection_target and selection_dump
level: critical
tags:
  - attack.credential-access
  - attack.t1003.001
  - endpoint-security
